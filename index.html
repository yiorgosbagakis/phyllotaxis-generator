<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Prompt Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            transition: background-color 0.3s;
        }

        #generateBtn {
            background-color: #3498db;
            color: white;
        }

        #generateBtn:hover {
            background-color: #2980b9;
        }

        #copyBtn {
            background-color: #2ecc71;
            color: white;
        }

        #copyBtn:hover {
            background-color: #27ae60;
        }

        #promptOutput {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-style: italic;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
        }

        .palette-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .color-swatch {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        pre {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            max-height: 400px;
        }
    </style>
</head>
<body>

    <h1>AI Image JSON Generator</h1>

    <div class="container">
        <div class="controls">
            <button id="generateBtn">Generate New Random Prompt</button>
        </div>

        <h3>Generated Description (Prompt):</h3>
        <div id="promptOutput">Click the button to generate a prompt.</div>
        <button id="copyBtn" style="display:none;">Copy Prompt</button>

        <h3>Generated Color Palette:</h3>
        <div class="palette-container" id="palette">
            <!-- Colors will appear here -->
        </div>

        <h3>Full Randomized JSON Output:</h3>
        <pre id="jsonOutput">Click generate...</pre>
    </div>

    <script>
        // --- Data Lists (The "Ingredients") ---
        const adjectives = ["electric", "neon", "pastel", "retro-futuristic", "minimalist", "geometric", "dynamic", "fluid", "abstract", "glitch-art", "vaporwave", "bioluminescent"];
        const subjects = ["data stream", "light sculpture", "frequency band", "color spectrum", "digital artifact", "sound wave matrix", "cosmic network", "neural pathway", "cybernetic construct"];
        const actions = ["pulsing", "cascading", "unfolding", "intertwining", "dissolving", "vibrating", "shifting", "crystallizing"];
        const structures = ["matrix", "vortex", "lattice", "grid", "shattered form", "fractal pattern", "helical flow"];
        const backgrounds = ["#FFFFFF", "#000000", "#1A1A1A", "#050505"];
        const lightingStyles = ["internal glow", "sharp studio light", "soft ambient diffused", "backlit light source", "volumetric lighting"];
        const lightOrigins = ["center", "left side", "edges", "below", "above"];
        const aspectRatios = ["16:9", "9:16", "1:1", "4:5", "21:9"];
        const imageTypes = ["digital art", "generative graphics", "data visualization", "photorealistic render", "3D procedural generation"];
        const textures = ["random dots", "diagonal lines", "pixel noise", "circuit traces", "topographic lines", "halftone dots"];

        // --- Helper Functions ---

        // Pick a random item from an array
        const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Generate a random valid hex color
        const generateRandomColor = () => {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        };

        // --- Core Generator Function ---
        function generateData() {
            // 1. Build the random description string
            const adj = getRandomItem(adjectives);
            const sub = getRandomItem(subjects);
            const act = getRandomItem(actions);
            const struct = getRandomItem(structures);
            const bgHex = getRandomItem(backgrounds);
            const bgName = bgHex === "#FFFFFF" ? "white" : "dark";

            const descriptionPrompt = `A ${adj} ${sub} that is ${act} in a ${struct} pattern against a clean ${bgName} background.`;

            // 2. Generate the color palette
            const colors = {
                background: bgHex,
                primary: generateRandomColor(),
                secondary_1: generateRandomColor(),
                secondary_2: generateRandomColor(),
                accent: generateRandomColor()
            };

            // 3. Construct the JSON structure
            const data = {
                "metadata": {
                    "image_type": getRandomItem(imageTypes),
                    "aspect_ratio": getRandomItem(aspectRatios),
                    "random_seed": Math.floor(Math.random() * 90000) + 10000,
                    "generated_at": new Date().toISOString()
                },
                "style": {
                    "prompt": descriptionPrompt,
                    "lighting_style": `${getRandomItem(lightingStyles)} emanating from the ${getRandomItem(lightOrigins)}.`,
                    "color_palette": colors
                },
                "itemized_elements": [
                    {
                        "id": 1,
                        "type": `${Math.random() > 0.5 ? 'Geometric' : 'Organic'} shapes`,
                        "position": "Central composition",
                        "color_influence": colors.primary
                    },
                    {
                        "id": 2,
                        "type": "Texture overlay",
                        "description": `A faint layer of ${getRandomItem(textures)}.`,
                        "color_influence": colors.accent
                    }
                ]
            };

            return data;
        }

        // --- UI Update Function ---
        function updateUI() {
            const generatedData = generateData();
            const promptStr = generatedData.style.prompt;

            // Update text prompt
            document.getElementById('promptOutput').innerText = promptStr;
            document.getElementById('copyBtn').style.display = 'inline-block';

            // Update JSON display
            document.getElementById('jsonOutput').innerText = JSON.stringify(generatedData, null, 4);

            // Update Color Palette display
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = ''; // Clear existing

            const colors = generatedData.style.color_palette;
            for (const [key, hex] of Object.entries(colors)) {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = hex;
                swatch.innerText = hex.toUpperCase();
                
                // Adjust text color for contrast if background is too light
                if (key === 'background' && hex === '#FFFFFF') {
                    swatch.style.color = '#333';
                    swatch.style.textShadow = 'none';
                }

                paletteContainer.appendChild(swatch);
            }
        }

        // --- Setup Event Listeners ---
        document.getElementById('generateBtn').addEventListener('click', updateUI);

        document.getElementById('copyBtn').addEventListener('click', () => {
            const promptText = document.getElementById('promptOutput').innerText;
            navigator.clipboard.writeText(promptText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Copied!";
                copyBtn.style.backgroundColor = "#27ae60";
                setTimeout(() => {
                    copyBtn.innerText = "Copy Prompt";
                    copyBtn.style.backgroundColor = "#2ecc71";
                }, 1500);
            });
        });

        // Generate the first one on load
        updateUI();

    </script>
</body>
</html>
